name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Install Capacitor Android
        run: npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          node scripts/setup-android.mjs
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Moamen.apk

      - name: Publish latest APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE_TAG="$(date -u '+%Y.%m.%d')"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          CURRENT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${CURRENT_SHA::7}"
          COMMIT_MSG="$(git log -1 --pretty=%s | tr '\r\n`' '   ')"

          TAG_NAME="v${BUILD_DATE_TAG}-b${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            TAG_NAME="${TAG_NAME}-r${GITHUB_RUN_ATTEMPT}"
          fi

          RELEASE_TITLE="Moamen ${TAG_NAME}"
          NOTES="### Latest Update (${BUILD_TIME})

          - **Change:** ${COMMIT_MSG}
          - **Commit:** \`${SHORT_SHA}\`
          - **Download:** Tap **Moamen.apk** below to install on your Android phone."

          gh release create "${TAG_NAME}" Moamen.apk \
            --target "${CURRENT_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --latest
